<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <div class="logo">
        🎓 Smart Classroom
    </div>

    <nav>

        <a href="index.html">
            Student
        </a>

        <a href="history.html">
            Bookings
        </a>

        <a
            href="admin.html"
            class="active"
        >
            Admin
        </a>

    </nav>

</header>


<main>


<section class="hero">

    <h1>
        Admin Dashboard
    </h1>

    <p>
        Manage classroom seats and bookings
    </p>

</section>


<section class="stats">

    <div class="stat-card">

        <div class="stat-icon">
            💺
        </div>

        <h3>
            Total Seats
        </h3>

        <span id="totalSeats">
            0
        </span>

    </div>


    <div class="stat-card available-card">

        <div class="stat-icon">
            🟩
        </div>

        <h3>
            Available
        </h3>

        <span id="availableSeats">
            0
        </span>

    </div>


    <div class="stat-card booked-card">

        <div class="stat-icon">
            🟥
        </div>

        <h3>
            Booked
        </h3>

        <span id="bookedSeats">
            0
        </span>

    </div>

</section>


<section class="controls">

    <input
        type="text"
        id="searchAdmin"
        placeholder="🔍 Search seat"
    >


    <select id="adminFilter">

        <option value="all">
            All
        </option>

        <option value="Available">
            Available
        </option>

        <option value="Booked">
            Booked
        </option>

    </select>


    <button onclick="loadAdminData()">
        🔄 Refresh
    </button>

</section>


<div style="text-align:center;">

    <button
        class="reset-all-btn"
        onclick="resetAllSeats()"
    >
        ⚠ Reset All Seats
    </button>

</div>


<section class="table-container">

    <table>

        <thead>

            <tr>

                <th>
                    ID
                </th>

                <th>
                    Seat
                </th>

                <th>
                    Status
                </th>

                <th>
                    Action
                </th>

            </tr>

        </thead>


        <tbody id="seatTable">

        </tbody>

    </table>

</section>


<div id="toast"></div>


</main>


<footer>

    <p>
        Admin Panel • Smart Classroom Seat Booking System
    </p>

</footer>


<script src="admin.js"></script>

</body>

</html>
