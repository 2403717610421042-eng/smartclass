<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartClass | Booking Success</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


<header class="navbar">

    <div class="logo">
        🎓 SmartClass
    </div>

    <nav class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="booking.html">
            💺 Book Seat
        </a>

        <a href="history.html">
            📋 My Bookings
        </a>

        <a href="profile.html">
            👤 Profile
        </a>

    </nav>

</header>


<div class="success-page">

    <div class="success-card">

        <div class="success-icon">
            🎉
        </div>

        <h1>
            Booking Successful!
        </h1>

        <p>
            Your classroom seat has been reserved successfully.
        </p>


        <div class="booking-summary">

            <div class="summary-row">

                <span>
                    👤 Student
                </span>

                <strong id="studentName">
                    —
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    📧 Email
                </span>

                <strong id="studentEmail">
                    —
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    💺 Seat
                </span>

                <strong id="seatNumber">
                    —
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    📅 Date
                </span>

                <strong id="bookingDate">
                    —
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    🟢 Status
                </span>

                <strong>
                    CONFIRMED
                </strong>

            </div>

        </div>


        <a
            href="history.html"
            class="btn btn-purple">

            📋 View My Bookings

        </a>


        <a
            href="index.html"
            class="btn"
            style="background:#f1f5f9;margin-left:8px;">

            🏠 Home

        </a>

    </div>

</div>


<script src="success.js"></script>

</body>
</html>
