<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartClass | Profile</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


<header class="navbar">

    <div class="logo">
        🎓 SmartClass
    </div>

    <nav class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="booking.html">
            💺 Book Seat
        </a>

        <a href="history.html">
            📋 My Bookings
        </a>

        <a href="profile.html"
           class="active">
            👤 Profile
        </a>

        <a href="admin.html">
            🧑‍💼 Admin
        </a>

    </nav>

</header>


<div class="container">


    <div class="page-header">

        <div class="mini">
            STUDENT ACCOUNT
        </div>

        <h1>
            Student Profile
        </h1>

    </div>


    <div class="card profile">

        <div class="profile-avatar">
            👤
        </div>


        <h2 id="profileName">
            Student
        </h2>


        <p
            class="profile-email"
            id="profileEmail">
            student@email.com
        </p>


        <div class="profile-details">


            <div class="detail">

                <span>
                    Department
                </span>

                <strong id="profileDepartment">
                    —
                </strong>

            </div>


            <div class="detail">

                <span>
                    Year
                </span>

                <strong id="profileYear">
                    —
                </strong>

            </div>


            <div class="detail">

                <span>
                    Total Bookings
                </span>

                <strong id="totalBookings">
                    0
                </strong>

            </div>


            <div class="detail">

                <span>
                    Current Seat
                </span>

                <strong id="currentSeat">
                    —
                </strong>

            </div>

        </div>


        <br>


        <a
            href="booking.html"
            class="btn btn-purple">

            💺 Book a Seat

        </a>

    </div>

</div>


<script src="profile.js"></script>

</body>
</html>
